<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Просмотр заказа</title>
    <link rel="stylesheet" type="text/css" href="/css/orders/view_order.css">
</head>
<body>
    <div class="container">
        <h2>Заказ #<span th:text="${order.id}"></span></h2>
        <p>Клиент: <span th:text="${order.customerName}"></span></p>
        
        <h3>Товары:</h3>
        <ul>
            <li th:each="item : ${order.items}">
                <span th:text="${item.carPart.partName}"></span> - 
                <span th:text="'Количество: ' + ${item.quantity}"></span>
            </li>
        </ul>
        
        <a href="/orders" class="btn btn-secondary">Вернуться к заказам</a>
    </div>
</body>
</html>
