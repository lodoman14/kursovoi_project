<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список заказов</title>
    <link rel="stylesheet" type="text/css" href="/css/orders/orders.css">
</head>
<body>
    <div class="container">
        <h2>Список заказов</h2>

        <ul>
            <li th:each="order : ${orders}">
                <span th:text="'Заказ #' + ${order.id} + ' от ' + ${order.customerName}"></span>
                <a th:href="@{'/orders/' + ${order.id}}" class="btn btn-view">Просмотр</a>
                <form th:action="@{'/orders/updateStatus/' + ${order.id}}" method="post" style="display:inline;">
                    <select name="status" onchange="this.form.submit()">
                        <option th:selected="${order.status == 'Создан счет'}" value="Создан счет">Создан счет</option>
                        <option th:selected="${order.status == 'Оплата получена'}" value="Оплата получена">Оплата получена</option>
                        <option th:selected="${order.status == 'Готов к отгрузке'}" value="Готов к отгрузке">Готов к отгрузке</option>
                        <option th:selected="${order.status == 'Доставка до клиента'}" value="Доставка до клиента">Доставка до клиента</option>
                        <option th:selected="${order.status == 'Закрыт'}" value="Закрыт">Закрыт</option>
                    </select>
                </form>
            </li>
        </ul>

        <a href="/orders/new" class="btn btn-primary">Создать заказ</a>
        <a href="/brands" class="btn btn-secondary">Вернуться к брендам</a>
    </div>
</body>
</html>
