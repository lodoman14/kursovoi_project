<ul>
    <li th:each="order : ${orders}">
        <span th:text="'Заказ #' + ${order.id} + ' от ' + ${order.customerName}"></span>
        <span>Статус: <span th:text="${order.status.statusName}"></span></span>
        <form th:action="@{'/orders/' + ${order.id} + '/status/update'}" method="post">
            <select name="statusId" required>
                <option th:each="status : ${statuses}" th:value="${status.id}" th:text="${status.statusName}"></option>
            </select>
            <button type="submit">Обновить статус</button>
        </form>
    </li>
</ul>
