<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список заказов</title>
    <link rel="stylesheet" href="/css/orders.css">
</head>
<body>
    <h1>Список заказов</h1>
    <table>
        <thead>
            <tr>
                <th>№ Заказа</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.items.stream().mapToDouble(i -> i.carPart.price * i.quantity).sum()}"></td>
                <td>
                    <form th:action="@{/orders/updateStatus}" method="post">
                        <input type="hidden" name="orderId" th:value="${order.id}" />
                        <select name="status">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
                                    th:selected="${order.status == status}"></option>
                        </select>
                        <button type="submit">Обновить</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
