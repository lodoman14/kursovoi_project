<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали заказа</title>
    <link rel="stylesheet" th:href="@{/css/invoice_details.css}" />
</head>
<body>
    <div class="container">
        <h2>Детали заказа №<span th:text="${invoice.id}"></span></h2>

        <div class="client-info">
            <h3>Информация о клиенте</h3>
            <p><strong>ФИО:</strong> <span th:text="${invoice.fullName}"></span></p>
            <p><strong>Телефон:</strong> <span th:text="${invoice.phone}"></span></p>
            <p><strong>Email:</strong> <span th:text="${invoice.email}"></span></p>
            <p><strong>Адрес:</strong> <span th:text="${invoice.address}"></span></p>
        </div>

        <h3>Товары</h3>
        <table class="product-table">
            <thead>
                <tr>
                    <th>Марка</th>
                    <th>Модель</th>
                    <th>Запчасть</th>
                    <th>Количество</th>
                    <th>Цена</th>
                    <th>Итого</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${invoice.items}">
                    <td th:text="${item.carPart.carModel.carBrand.brandName}"></td>
                    <td th:text="${item.carPart.carModel.modelName}"></td>
                    <td th:text="${item.carPart.partName}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${item.carPart.price}"></td>
                    <td th:text="${item.totalPrice}"></td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            <h3>Общая сумма:</h3>
            <p th:text="${totalSum}"></p>
        </div>
        <a href="/invoices/orders" class="btn-secondary">Назад к заказам</a>
    </div>
</body>
</html>
