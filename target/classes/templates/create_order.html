<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Создание заказа</title>
</head>
<body>
<h1>Создание нового заказа</h1>
<form th:action="@{/orders/save}" method="post">
    <label>Имя клиента:</label>
    <input type="text" name="customerName" required>
    <br>
    <label>Адрес:</label>
    <input type="text" name="address" required>
    <br>
    <label>Телефон:</label>
    <input type="text" name="phone" required>
    <br><br>
    <h2>Добавить товары:</h2>
    <div th:each="part, iterStat : ${parts}">
        <label>
            <input type="checkbox" th:name="'items[' + ${iterStat.index} + '].selected'" value="true">
            <span th:text="${part.partName} + ' (Остаток: ' + ${part.quantity} + ')'"></span>
        </label>
        <input type="hidden" th:name="'items[' + ${iterStat.index} + '].carPartId'" th:value="${part.id}">
        <label>Количество:</label>
        <input type="number" th:name="'items[' + ${iterStat.index} + '].quantity'" min="1" value="1">
        <br>
    </div>
    <br>
    <button type="submit">Создать заказ</button>
</form>
<a th:href="@{/}">Вернуться на главную</a>
</body>
</html>
