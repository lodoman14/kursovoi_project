<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Создать заказ</title>
    <link rel="stylesheet" type="text/css" href="/css/orders/create_order.css">
</head>
<body>
    <div class="container">
        <h2>Создать новый заказ</h2>
        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>
        <form th:action="@{/orders/save}" th:object="${order}" method="post">
            <div>
                <label for="customerName">Имя клиента:</label>
                <input type="text" id="customerName" th:field="*{customerName}" required>
            </div>
            <div>
                <label for="phoneNumber">Номер телефона:</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div>
                <label for="deliveryAddress">Адрес доставки:</label>
                <input type="text" id="deliveryAddress" th:field="*{deliveryAddress}" required>
            </div>
            <div>
                <h3>Добавить товары:</h3>
                <div th:each="part : ${parts}">
                    <label>
                        <input type="checkbox" name="items[__${part.id}__].selected" value="true">
                        <span th:text="${part.partName} + ' (Остаток: ' + ${part.quantity} + ')'"></span>
                    </label>
                    <input type="hidden" name="items[__${part.id}__].carPartId" th:value="${part.id}">
                    <label>Количество:</label>
                    <input type="number" name="items[__${part.id}__].quantity" min="1">
                </div>
            </div>
            <button type="submit">Создать заказ</button>
            <a href="/orders" class="btn btn-secondary">Вернуться к заказам</a>
        </form>
    </div>
</body>
</html>
